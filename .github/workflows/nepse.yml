name: NEPSE Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: write

jobs:
  run-nepse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NEPSE automation
        run: |
          python -m nepse_agent.main

      - name: Check for CSV changes
        run: |
          git status
          git diff --stat

      - name: Commit and push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nepse_data/*.csv

          if git diff --cached --quiet; then
            echo "No CSV files were changed."
          else
            git commit -m "Update NEPSE CSV data"
            git push
          fi
