name:  Daily NEPSE Stock Selection Update

on:
  # Run Monday-Friday at 5:30 PM NPT (11:45 UTC) after NEPSE market closes
  schedule:
    - cron: '45 11 * * 1-5'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Number of top stocks to export'
        required: false
        default: '50'
        type: string

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v6

      - name:  Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name:  Install dependencies
        run: pip install -r requirements.txt

      - name:  Run NEPSE AI Agent
        run: |
          python run_daily.py --top ${{ inputs.top_n || '50' }}

      - name:  Commit updated possibleStocks.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add possibleStocks.csv
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "$(cat <<'EOF'
           Daily NEPSE stock picks updated

          Automated update of possibleStocks.csv with latest AI-powered
          stock selection scores based on current market data.

          Generated by: NEPSE AI Stock Selection Agent
          Workflow: daily_update.yml
          EOF
          )"
          git push
